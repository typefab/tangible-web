name: Deploy web

# Ad ogni push su main: build e pubblicazione su GitHub Pages.
# Il gioco diventa giocabile a https://<utente>.github.io/<repo>/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Le action stanno alle major correnti: le v4 giravano su Node 20, che i runner
# hanno dismesso. Le tre action di Pages (configure/upload/deploy) vanno tenute
# allineate fra loro: sono rilasciate come insieme.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
