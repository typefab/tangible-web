name: Build APK

# Genera un APK Android installabile sul telefono.
# Si avvia a mano dalla tab "Actions" di GitHub (bottone "Run workflow"):
# a fine build l'APK e' scaricabile dagli "Artifacts" della run.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Le action stanno alle major correnti: le v4 giravano su Node 20, che i runner
# hanno dismesso. Java resta alla 17: e' quella che si aspetta il Gradle
# generato da Capacitor, e non c'entra col Node dei runner.
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build

      # La cartella android/ non e' versionata: la rigeneriamo qui.
      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: tangible-cushion-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
