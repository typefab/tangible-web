name: Build APK

# Genera un APK Android installabile sul telefono.
# Si avvia a mano dalla tab "Actions" di GitHub (bottone "Run workflow"):
# a fine build l'APK e' scaricabile dagli "Artifacts" della run.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build

      # La cartella android/ non e' versionata: la rigeneriamo qui.
      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: tangible-cushion-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
