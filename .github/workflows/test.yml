name: Test

# I test girano a ogni push e su ogni pull request.
#
# Deliberatamente NON bloccano il deploy: `deploy-web.yml` parte comunque.
# Il motivo e' il ciclo di lavoro di questo progetto — una scena nuova si
# pubblica caricando `public/level.json` dalla UI web di GitHub, e quel giro
# deve restare di un minuto. Un test rosso per una ragione che non c'entra
# niente con un livello non deve impedire di pubblicare il livello.
#
# Il risultato resta visibile come spunta o croce sul commit. Se un giorno
# servisse il contrario, basta aggiungere `needs: test` al job `build` di
# deploy-web.yml.
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

# Le action stanno alle major correnti: le v4 giravano su Node 20, che i runner
# hanno dismesso e stavano gia' forzando a Node 24 con un avviso.
jobs:
  test:
    runs-on: ubuntu-latest
    # Un tetto al tempo del job. Senza, il limite e' quello di GitHub — sei ore
    # — e una run impiantata lascia il commit senza verdetto per tutto quel
    # tempo: ne' spunta ne' croce, che e' peggio di una croce, perche' non c'e'
    # niente da guardare. E' successo il 19 agosto, tre volte nella stessa
    # serata. Il giro normale sta in 4-5 minuti, il piu' lento mai visto in 8.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # La versione la decide `package-lock.json`, non questo file: leggerla da
      # li' fa in modo che aggiornare Playwright invalidi la cache da sola,
      # invece di lasciar rimettere al suo posto il browser della versione
      # precedente.
      - name: Versione di Playwright
        id: playwright
        run: |
          echo "versione=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Il browser pesa un centinaio di MB e arriva dalla rete: e' esattamente
      # il passo che si e' impiantato. Ripreso dalla cache non si scarica
      # affatto, quindi la strada che si e' rotta non viene nemmeno percorsa.
      #
      # Niente `restore-keys`: un ripiego parziale rimetterebbe il browser di
      # un'altra versione, che poi Playwright riscaricherebbe comunque. O la
      # chiave combacia, o si scarica.
      - name: Cache del browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.versione }}

      # Solo Chromium: i test provano il gioco, non la portabilita' fra browser.
      # `--with-deps` installa le librerie di sistema che servono al runner; il
      # browser lo salta da se' se la cache l'ha gia' rimesso al suo posto.
      #
      # Il tetto sta anche qui e non solo sul job, perche' e' questo il passo
      # che si pianta: cosi' il fallimento cade dove e' successo qualcosa, e chi
      # guarda la run legge subito cosa e' andato storto invece di trovare il
      # job troncato in un punto qualunque. Normalmente ci mette meno di un
      # minuto.
      - name: Install Chromium
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium

      # Il typecheck e il build stanno qui e non in un job a parte: se il
      # progetto non compila, i test non dicono niente di utile.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Serve solo quando qualcosa e' rotto: la traccia mostra ogni passo del
      # test con lo stato della pagina, che e' l'unico modo di capire un
      # fallimento su una macchina che non si puo' guardare.
      - name: Report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
